---

name: build project

on:
  push:
    # branches: 
    #   - main
    tags:
      - '*'


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            qemu: false
          - platform: linux/arm64
            suffix: arm64
            qemu: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: akeb/palabra:${{ github.ref_name }}-${{ matrix.suffix }}
          build-args: |
            SERVER_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.suffix }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch release manifest
        run: |
          docker buildx imagetools create \
            -t akeb/palabra:${{ github.ref_name }} \
            -t akeb/palabra:latest \
            akeb/palabra:${{ github.ref_name }}-amd64 \
            akeb/palabra:${{ github.ref_name }}-arm64
